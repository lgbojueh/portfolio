name: Update Resume Links

on:
  push:
    paths:
      - 'tools/update_resume_links.py'

permissions:
  contents: write

jobs:
  update-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update resume references
        run: python tools/update_resume_links.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Point portfolio to Resume.pdf"
          git push

name: Add Parser and AST Projects

on:
  push:
    paths:
      - 'tools/add_parser_ast_projects.py'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update project list
        run: python tools/add_parser_ast_projects.py
      - name: Commit portfolio update
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Feature parser and static analysis projects"
          git push

name: Portfolio SignalDesk Update

on:
  push:
    paths:
      - 'tools/portfolio_signaldesk_patch.py'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update portfolio content
        run: python tools/portfolio_signaldesk_patch.py
      - name: Commit portfolio update
        run: |
          if git diff --quiet; then
            echo "No portfolio changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Feature SignalDesk AI on portfolio"
          git push
